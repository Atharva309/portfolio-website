<body>
    <style>
        html, body { background: transparent !important; }
        .hero { background: transparent !important; }
        .hero::before { display: none !important; }
        
        /* Back Button */
        .back-button {
            position: absolute;
            top: 2rem;
            left: 2rem;
            z-index: 1000;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s ease, transform 0.3s ease;
        }
        .back-button:hover {
            color: var(--primary);
            transform: translateX(-5px);
        }
        
        /* Nebula Gateway Styles */
        .gateway-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 2rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
        }
        .nebula-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(160, 200, 255, 0.7) 0%, rgba(3,2,10,0) 70%);
            opacity: 0.8;
            transition: opacity 0.5s ease, transform 0.5s ease;
            z-index: 1;
        }
        .gateway-container:hover .nebula-glow {
            opacity: 1;
            transform: scale(1.1);
        }
        .gateway-label {
            position: relative;
            color: #F0EEF8;
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            opacity: 0.3;
            transition: opacity 0.5s ease;
            z-index: 2;
        }
        .gateway-container:hover .gateway-label {
            opacity: 1;
        }

        /* Scatter Transition */
        .page-transitioning .nebula-glow {
            transform: scale(25);
            opacity: 1;
            background: radial-gradient(circle, #fff 0%, rgba(160, 200, 255, 0.4) 50%, rgba(3,2,10,1) 100%);
            z-index: 100;
        }
        .page-transitioning .gateway-label { opacity: 0; }
        .page-transitioning #planet-container {
            /* Handled by planet-scatter class */
        }
        .page-transitioning section:not(#projects-preview), 
        .page-transitioning header, 
        .page-transitioning footer,
        .page-transitioning #projects-preview h2,
        .page-transitioning #projects-preview p {
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        @keyframes planetSlideIn {
            0% { transform: translateX(100vw); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        .planet-scatter {
            animation: planetFlyAway 0.8s cubic-bezier(0.5, 0, 1, 0.5) forwards !important;
        }
        @keyframes planetFlyAway {
            to { transform: translate(-100vw, 100vh) scale(0.1); opacity: 0; }
        }
    </style>
    
    <a href="about.html" class="back-button">
        <i class="fas fa-arrow-left"></i> Back to About
    </a>
    <div id="about-background" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; background: #03020A;">
        <canvas id="about-starfield" style="position: absolute; top: -50vh; left: -50vw; width: 200vw; height: 200vh;"></canvas>
        <div id="planet-container" style="position: absolute; bottom: -15vw; left: -15vw; width: 60vw; height: 60vw; min-width: 500px; min-height: 500px; animation: planetSlideIn 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;">
            <div id="about-planet" style="width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #76569f 0%, #301f46 70%, #11091d 100%); transform-origin: center center; position: relative;">
                <!-- Rings -->
                <div style="position: absolute; top: 50%; left: 50%; width: 130%; height: 130%; border: 15px solid rgba(212, 175, 55, 0.15); border-radius: 50%; transform: translate(-50%, -50%) rotateX(75deg) rotateY(15deg); pointer-events: none;"></div>
                <!-- Moon -->
                <div id="about-moon" style="position: absolute; top: 15%; right: 5%; width: 5vw; height: 5vw; min-width: 50px; min-height: 50px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #a4a4b4 0%, #5a5a6a 70%, #11091d 100%); box-shadow: inset -5px -5px 15px rgba(0,0,0,0.9), 0 0 20px rgba(255,255,255,0.05);"></div>
            </div>
        </div>
    </div>


    <section id="resume-viewer" class="about-section" style="padding-top: 100px; min-height: 100vh;">
        <div class="container reveal">
            <h2 class="section-title">Resume</h2>
            
            <div class="glass-card" style="padding: 1rem; height: 80vh; margin-bottom: 3rem;">
                <object data="assets/resume.pdf" type="application/pdf" width="100%" height="100%">
                    <p style="text-align: center; color: var(--text-muted); margin-top: 2rem;">It appears you don't have a PDF plugin for this browser. <br><br> <a href="assets/resume.pdf" class="btn-primary">Click here to download the PDF file.</a></p>
                </object>
            </div>
            
            <div class="glass-card contact-card" style="margin-bottom: 2rem; text-align: center;">
                <h2 style="font-size: 2rem; margin-bottom: 1rem;">Need a Custom Resume?</h2>
                <p style="color: var(--text-muted); max-width: 600px; margin: 0 auto 2.5rem;">Request a custom resume tailored specifically to your job role and requirements.</p>
                <div class="contact-buttons" style="display: flex; justify-content: center;">
                    <a href="mailto:aspatil0910@gmail.com?subject=Resume%20Request%20%E2%80%94%20%5BRole%5D&body=Hi%20Atharva%2C%0D%0A%0D%0AI%20would%20like%20to%20request%20a%20copy%20of%20your%20custom%20resume%20for%20the%20following%20role%3A%0D%0A%0D%0A%5BInsert%20Role/Job%20Description%20Here%5D" class="btn-primary">Request Custom Resume <i class="fas fa-envelope"></i></a>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>Designed & Built by Atharva Patil</p>
        </div>
    </footer>
