<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Projects | Atharva Patil</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="overflow-x: hidden;">
    <style>
        .back-button {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s ease, transform 0.3s ease;
        }
        .back-button:hover {
            color: var(--primary);
            transform: translateX(-5px);
        }
        
        .projects-nav {
            position: sticky;
            top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            pointer-events: auto;
            z-index: 100;
            margin-top: 0.5rem;
            margin-left: 2rem;
            width: max-content;
        }
        .nav-btn {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        .nav-btn:hover {
            background: rgba(108, 99, 255, 0.2);
            border-color: var(--primary);
            color: white;
            transform: translateX(10px);
        }
        
        @keyframes subtleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(5px); }
        }
    </style>
    <section id="constellation-section" style="position: relative; width: 100vw; min-height: 100vh; display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; background: linear-gradient(rgba(2, 6, 23, 0.93), rgba(2, 6, 23, 0.98)), url('https://www.nasa.gov/wp-content/uploads/2023/03/main_image_star-forming_region_carina_nircam_final-5mb.jpg') no-repeat center center / cover fixed;">
        <!-- Container in normal flow for sticky behavior -->
        <div class="container" style="margin-top: 0.5rem; margin-left: 1.5rem; z-index: 10; pointer-events: none; display: flex; flex-direction: column; align-items: flex-start; text-align: left;">
            
            <a href="index.html" class="back-button" style="pointer-events: auto; margin-bottom: 1.5rem;">
                <i class="fas fa-arrow-left"></i> Return Home
            </a>

            <h2 class="section-title" style="margin-bottom: 0.5rem; font-size: 3.5rem; text-shadow: 0 0 20px rgba(255,255,255,0.2);">My Projects</h2>
            <p style="color: var(--text-muted); font-size: 1.1rem; letter-spacing: 0.05em; margin-bottom: 0.5rem;">Hover and click to see my projects</p>
            <p style="color: var(--primary); font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; animation: subtleBounce 2s infinite;">Keep scrolling down! <i class="fas fa-arrow-down"></i></p>
        </div>
        
        <div class="projects-nav">
            <button class="nav-btn" onclick="scrollToCategory(0)">AI / ML</button>
            <button class="nav-btn" onclick="scrollToCategory(1)">Data Analytics</button>
            <button class="nav-btn" onclick="scrollToCategory(2)">Cloud / Full-Stack</button>
        </div>

        <canvas id="constellationCanvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: crosshair; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; outline: none; z-index: 1;"></canvas>
        
        <div id="star-tooltip" style="position: absolute; pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 100; transform: translate(20px, -20px);">
        <div class="glass-card" style="padding: 1rem; border-radius: 12px; width: 280px; background: rgba(15, 23, 42, 0.9); box-shadow: 0 10px 40px rgba(0,0,0,0.8); border-color: rgba(255,255,255,0.1);">
            <img id="tooltip-image" src="" alt="Project Preview" style="width: 100%; height: 130px; object-fit: cover; border-radius: 8px; margin-bottom: 0.75rem; display: none; border: 1px solid rgba(255,255,255,0.1);">
            <h4 id="tooltip-title" style="margin-bottom: 0.25rem; font-size: 1.1rem; line-height: 1.2; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">Project Title</h4>
            <span id="tooltip-category" style="font-size: 0.8rem; color: var(--secondary); font-weight: 600; display: block; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.5px;">Category</span>
            <p id="tooltip-desc" style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;">Description goes here...</p>
        </div>

    </section>

    <script src="data.js"></script>
    <script src="constellation.js"></script>
    <script>
        function scrollToCategory(index) {
            // Formula matches title placement in constellation.js
            const targetY = (index + 0.9) * window.innerHeight - 360;
            window.scrollTo({
                top: targetY,
                behavior: 'smooth'
            });
        }
    </script>
</body>
</html>
