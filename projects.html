<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Projects | Atharva Patil</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="overflow-x: hidden;">
    <style>
        .back-button {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s ease, transform 0.3s ease;
        }
        .back-button:hover {
            color: var(--primary);
            transform: translateX(-5px);
        }
        .nav-btn {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        .nav-btn:hover {
            background: rgba(108, 99, 255, 0.2);
            border-color: var(--primary);
            color: white;
            transform: translateX(10px);
        }
        
        @keyframes subtleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(5px); }
        }
        
        @keyframes projectsSlideIn {
            0% { transform: translateX(-100vw); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes uiFadeIn {
            0% { opacity: 0; transform: translateY(-20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes uiFadeInCenter {
            0% { opacity: 0; transform: translate(-50%, -20px); }
            100% { opacity: 1; transform: translate(-50%, 0); }
        }
    </style>
    <section id="constellation-section" style="position: relative; width: 100vw; min-height: 100vh; display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; background: var(--bg-dark);">
        
        <!-- Rebuilt Top Left Control Panel (Absolute coordinates lock it to exact top-left) -->
        <div id="control-panel" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; padding: 25px 35px; pointer-events: none; z-index: 10; display: block; animation: uiFadeIn 1s ease-out 0.5s both;">
            
            <a href="index.html" class="back-button" style="pointer-events: auto; display: inline-flex; margin-bottom: 25px;">
                <i class="fas fa-arrow-left"></i> Return Home
            </a>
            
            <div style="position: sticky; top: 25px; display: flex; flex-direction: column; gap: 15px; pointer-events: auto; width: max-content;">
                <button class="nav-btn" onclick="scrollToCategory(0)">AI / ML</button>
                <button class="nav-btn" onclick="scrollToCategory(1)">Data Analytics</button>
                <button class="nav-btn" onclick="scrollToCategory(2)">Cloud / Full-Stack</button>
            </div>
            
        </div>

        <canvas id="constellationCanvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: crosshair; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; outline: none; z-index: 1; pointer-events: auto; animation: projectsSlideIn 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;"></canvas>
        
        <div id="star-tooltip" style="position: absolute; pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 100; transform: translate(20px, -20px);">
        <div class="glass-card" style="padding: 1rem; border-radius: 12px; width: 280px; background: rgba(15, 23, 42, 0.9); box-shadow: 0 10px 40px rgba(0,0,0,0.8); border-color: rgba(255,255,255,0.1);">
            <img id="tooltip-image" src="" alt="Project Preview" style="width: 100%; height: 130px; object-fit: cover; border-radius: 8px; margin-bottom: 0.75rem; display: none; border: 1px solid rgba(255,255,255,0.1);">
            <h4 id="tooltip-title" style="margin-bottom: 0.25rem; font-size: 1.1rem; line-height: 1.2; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">Project Title</h4>
            <span id="tooltip-category" style="font-size: 0.8rem; color: var(--secondary); font-weight: 600; display: block; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.5px;">Category</span>
            <p id="tooltip-desc" style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;">Description goes here...</p>
        </div>

    </section>

    <script src="data.js"></script>
    <script src="constellation.js"></script>
    <script>
        function scrollToCategory(index) {
            // Formula matches title placement in constellation.js
            const isMobile = window.innerWidth <= 768;
            const spacing = isMobile ? 1.5 : 1.2;
            const targetY = (index + spacing) * window.innerHeight - (isMobile ? 260 : 360);
            window.scrollTo({
                top: targetY,
                behavior: 'smooth'
            });
        }
    </script>
</body>
</html>
